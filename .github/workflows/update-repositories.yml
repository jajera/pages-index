name: Update repository index

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - scripts/update-repositories.mjs

permissions:
  contents: write

concurrency:
  group: update-repositories
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Update repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run update

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repositories.json
          if git diff --cached --quiet; then
            echo "No index data changes"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore: refresh repository index data

          Rebuild data/repositories.json from GitHub API discovery.
          EOF
          )"
          git push
